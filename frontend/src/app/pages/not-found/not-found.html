<div class="not-found-container">
  <div class="not-found-content">
    <div class="error-code">404</div>
    <div class="error-subtitle">PAGE NOT FOUND / ACCESS DENIED</div>
    <h1 class="error-title">Oops! Looks like you're lost.</h1>
    <p class="error-message">
      The page you are trying to access doesn't exist, or you may need to log in to view this content.
    </p>
    
    <div class="action-buttons">
      <button class="btn-primary" (click)="goToLogin()">Login Now <span class="arrow">→</span></button>
      <a routerLink="/" class="btn-secondary">Back to Home</a>
    </div>
  </div>
</div>
