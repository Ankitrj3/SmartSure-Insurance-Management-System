<div class="callback-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif;">
  <div class="loader" *ngIf="loading" style="border: 4px solid #f3f3f3; border-top: 4px solid #ff6b00; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;"></div>
  <h2 style="margin-top: 20px; color: #2b3674;">{{ loading ? 'Authenticating with Google...' : (error ? 'Authentication Failed' : 'Success!') }}</h2>
  <p *ngIf="error" style="color: #e53e3e;">{{ error }}</p>
  <button *ngIf="error" (click)="goToLogin()" style="margin-top: 20px; padding: 10px 20px; border: none; border-radius: 8px; background: #ff6b00; color: white; cursor: pointer;">Return to Login</button>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</div>
