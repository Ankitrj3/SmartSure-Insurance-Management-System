<div class="auth-container">
  <div class="glass-panel auth-card">
    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p>Enter your email to receive an OTP and reset your password.</p>
    </div>

    <!-- Error/Success Messages -->
    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }
    @if (successMessage) {
      <div class="alert alert-success">
        {{ successMessage }}
      </div>
    }

    @if (step === 'email') {
      <form (ngSubmit)="onSendOtp()" #emailForm="ngForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-base" 
            [(ngModel)]="email" 
            required 
            placeholder="your@email.com">
        </div>

        <button type="submit" class="btn-primary" [disabled]="!emailForm.valid || isLoading" style="width: 100%; margin-top: 16px;">
          @if (isLoading) {
            <span>Sending OTP...</span>
          } @else {
            <span>Send OTP</span>
          }
        </button>
      </form>
    } @else {
      <form (ngSubmit)="onResetPassword()" #resetForm="ngForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-base" 
            [(ngModel)]="email" 
            required 
            readonly>
        </div>

        <div class="form-group">
          <label for="otp">OTP Code</label>
          <input 
            type="text" 
            id="otp" 
            name="otp" 
            class="input-base" 
            [(ngModel)]="otp" 
            required 
            placeholder="Enter 6-digit OTP">
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            class="input-base" 
            [(ngModel)]="newPassword" 
            required 
            placeholder="Min 8 chars, uppercase, digit, symbol">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            class="input-base" 
            [(ngModel)]="confirmPassword" 
            required 
            placeholder="Confirm new password">
        </div>

        <button type="submit" class="btn-primary" [disabled]="!resetForm.valid || isLoading" style="width: 100%; margin-top: 16px;">
          @if (isLoading) {
            <span>Resetting Password...</span>
          } @else {
            <span>Reset Password</span>
          }
        </button>
      </form>
    }

    <div class="auth-footer" style="margin-top: 20px;">
      <p>Remembered your password? <a routerLink="/login">Sign In here</a></p>
    </div>
  </div>
</div>
