<header class="smartsure-navbar">
  <div class="container navbar-container">
    <div class="brand" routerLink="/">
      <svg viewBox="0 0 32 32" fill="none" class="brand-icon">
        <path d="M16 0L32 8V24L16 32L0 24V8L16 0Z" fill="#1A1A1A"/>
        <path d="M16 5V27L4 21V11L16 5Z" fill="#0DB18C"/>
        <path d="M16 5L28 11V21L16 27V5Z" fill="#0A8E70"/>
      </svg>
      <h1 class="brand-text">SMART<span class="text-teal">SURE</span></h1>
    </div>
    
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/insurance" routerLinkActive="active">Insurance</a>
      <a routerLink="/about-us" routerLinkActive="active">About</a>
      <a routerLink="/contact-us" routerLinkActive="active">Contact</a>
    </nav>

    <div class="auth-section">
      <ng-container *ngIf="!isLoggedIn">
        <button class="btn-text" routerLink="/login">Log In</button>
        <button class="btn-primary btn-quote-nav" routerLink="/register">REGISTER HERE</button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu">
           <span class="role-text">{{ isAdmin ? 'Admin' : 'Personal' }}</span>
           <button class="btn-primary btn-quote-nav" *ngIf="isAdmin" routerLink="/admin/dashboard">Dashboard</button>
           <button class="btn-primary btn-quote-nav" *ngIf="!isAdmin" routerLink="/user/dashboard">Dashboard</button>
           
           <div class="dropdown-wrapper">
             <button class="btn-icon-user" (click)="toggleDropdown($event)">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                 <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                 <circle cx="12" cy="7" r="4"></circle>
               </svg>
             </button>
             
             <div class="dropdown-menu" *ngIf="showDropdown">
               <a routerLink="/profile" class="dropdown-item" (click)="closeDropdown()">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                   <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                   <circle cx="12" cy="7" r="4"></circle>
                 </svg>
                 Profile
               </a>
               <div class="dropdown-divider"></div>
               <button class="dropdown-item" (click)="logout()">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                   <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                   <polyline points="16 17 21 12 16 7"></polyline>
                   <line x1="21" y1="12" x2="9" y2="12"></line>
                 </svg>
                 Sign Out
               </button>
             </div>
           </div>
        </div>
      </ng-container>
    </div>
  </div>
</header>
