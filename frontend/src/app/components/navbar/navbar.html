<header class="smartsure-navbar">
  <div class="container navbar-container">
    <div class="brand" routerLink="/">
      <svg viewBox="0 0 24 24" fill="none" class="brand-icon">
        <path d="M12 2L3 6v6.22c0 5.51 3.84 10.74 9 12 5.16-1.26 9-6.49 9-12V6l-9-4z" fill="#0DB18C"/>
        <path d="M12 2v20c5.16-1.26 9-6.49 9-12V6l-9-4z" fill="#0A8E70"/>
      </svg>
      <h1 class="brand-text">SMARTSURE</h1>
    </div>
    
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/insurance" routerLinkActive="active">Insurance</a>
      <a routerLink="/about-us" routerLinkActive="active">About</a>
      <a routerLink="/contact-us" routerLinkActive="active">Contact</a>
    </nav>

    <div class="auth-section">
      <ng-container *ngIf="!isLoggedIn">
        <button class="btn-text" routerLink="/login">Log In</button>
        <button class="btn-primary btn-quote-nav" routerLink="/register">GET A QUOTE</button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu">
           <span class="role-text">{{ isAdmin ? 'Admin' : 'Personal' }}</span>
           <button class="btn-primary btn-quote-nav" *ngIf="isAdmin" routerLink="/admin/dashboard">Dashboard</button>
           <button class="btn-primary btn-quote-nav" *ngIf="!isAdmin" routerLink="/user/dashboard">Dashboard</button>
           <button class="btn-text" (click)="logout()">Sign Out</button>
        </div>
      </ng-container>
    </div>
  </div>
</header>
