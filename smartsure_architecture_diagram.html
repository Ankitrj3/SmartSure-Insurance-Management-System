<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSure – Architecture Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1117; color: #e2e8f0; padding: 24px; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; color: #7dd3fc; margin-bottom: 6px; letter-spacing: 0.5px; }
  .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .diagram-wrapper { max-width: 1100px; margin: 0 auto; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
  .legend { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div class="diagram-wrapper">
  <h1>SmartSure – System Architecture</h1>
  <p class="subtitle">Microservices Architecture with API Gateway, Message Broker &amp; External Integrations</p>

  <svg width="100%" viewBox="0 0 1060 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ── CLIENT LAYER ── -->
    <rect x="20" y="16" width="1020" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="36" text-anchor="middle" font-size="11" fill="#475569" font-weight="600" letter-spacing="1">CLIENT LAYER</text>

    <!-- Angular SPA -->
    <rect x="320" y="44" width="200" height="40" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
    <text x="420" y="60" text-anchor="middle" font-size="13" fill="#bfdbfe" font-weight="600">Angular SPA</text>
    <text x="420" y="76" text-anchor="middle" font-size="11" fill="#93c5fd">Port 4200</text>

    <!-- Mobile / Browser -->
    <rect x="560" y="44" width="160" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="640" y="66" text-anchor="middle" font-size="12" fill="#94a3b8">Browser / Mobile</text>

    <!-- ── GATEWAY LAYER ── -->
    <rect x="20" y="120" width="1020" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="140" text-anchor="middle" font-size="11" fill="#475569" font-weight="600" letter-spacing="1">GATEWAY LAYER</text>

    <rect x="330" y="148" width="340" height="40" rx="8" fill="#7c3aed" stroke="#a78bfa" stroke-width="1"/>
    <text x="500" y="164" text-anchor="middle" font-size="13" fill="#ede9fe" font-weight="600">Ocelot API Gateway</text>
    <text x="500" y="180" text-anchor="middle" font-size="11" fill="#c4b5fd">Port 5057 · JWT Auth · QoS · Swagger Aggregation</text>

    <!-- ── MICROSERVICES LAYER ── -->
    <rect x="20" y="224" width="1020" height="176" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="244" text-anchor="middle" font-size="11" fill="#475569" font-weight="600" letter-spacing="1">MICROSERVICES LAYER</text>

    <!-- Identity Service -->
    <rect x="40" y="254" width="220" height="130" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="150" y="278" text-anchor="middle" font-size="13" fill="#6ee7b7" font-weight="600">Identity Service</text>
    <text x="150" y="296" text-anchor="middle" font-size="11" fill="#34d399">Port 5168</text>
    <text x="150" y="314" text-anchor="middle" font-size="11" fill="#6ee7b7">Auth / JWT / OAuth</text>
    <text x="150" y="330" text-anchor="middle" font-size="11" fill="#6ee7b7">OTP / Google SSO</text>
    <text x="150" y="346" text-anchor="middle" font-size="11" fill="#6ee7b7">User Management</text>
    <text x="150" y="362" text-anchor="middle" font-size="11" fill="#6ee7b7">Email Service</text>

    <!-- Policy Service -->
    <rect x="290" y="254" width="220" height="130" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="400" y="278" text-anchor="middle" font-size="13" fill="#bfdbfe" font-weight="600">Policy Service</text>
    <text x="400" y="296" text-anchor="middle" font-size="11" fill="#93c5fd">Port 5014</text>
    <text x="400" y="314" text-anchor="middle" font-size="11" fill="#bfdbfe">Insurance Types/Subtypes</text>
    <text x="400" y="330" text-anchor="middle" font-size="11" fill="#bfdbfe">Policy Lifecycle</text>
    <text x="400" y="346" text-anchor="middle" font-size="11" fill="#bfdbfe">Discounts / IDV Calc</text>
    <text x="400" y="362" text-anchor="middle" font-size="11" fill="#bfdbfe">Razorpay Payments</text>

    <!-- Claims Service -->
    <rect x="540" y="254" width="220" height="130" rx="10" fill="#451a03" stroke="#f97316" stroke-width="1"/>
    <text x="650" y="278" text-anchor="middle" font-size="13" fill="#fed7aa" font-weight="600">Claims Service</text>
    <text x="650" y="296" text-anchor="middle" font-size="11" fill="#fdba74">Port 5265</text>
    <text x="650" y="314" text-anchor="middle" font-size="11" fill="#fed7aa">Claim Submission</text>
    <text x="650" y="330" text-anchor="middle" font-size="11" fill="#fed7aa">Document Upload (S3)</text>
    <text x="650" y="346" text-anchor="middle" font-size="11" fill="#fed7aa">Status Tracking</text>
    <text x="650" y="362" text-anchor="middle" font-size="11" fill="#fed7aa">Claim History</text>

    <!-- Admin Service -->
    <rect x="790" y="254" width="230" height="130" rx="10" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
    <text x="905" y="278" text-anchor="middle" font-size="13" fill="#ddd6fe" font-weight="600">Admin Service</text>
    <text x="905" y="296" text-anchor="middle" font-size="11" fill="#c4b5fd">Port 5232</text>
    <text x="905" y="314" text-anchor="middle" font-size="11" fill="#ddd6fe">User/Policy/Claim Mgmt</text>
    <text x="905" y="330" text-anchor="middle" font-size="11" fill="#ddd6fe">Reports &amp; PDF Export</text>
    <text x="905" y="346" text-anchor="middle" font-size="11" fill="#ddd6fe">Audit Logs</text>
    <text x="905" y="362" text-anchor="middle" font-size="11" fill="#ddd6fe">Dashboard Stats</text>

    <!-- ── MESSAGE BUS ── -->
    <rect x="20" y="424" width="1020" height="64" rx="12" fill="#1c1917" stroke="#78716c" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="530" y="444" text-anchor="middle" font-size="11" fill="#78716c" font-weight="600" letter-spacing="1">MESSAGE BUS</text>
    <rect x="330" y="452" width="400" height="26" rx="6" fill="#292524" stroke="#a8a29e" stroke-width="1"/>
    <text x="530" y="469" text-anchor="middle" font-size="13" fill="#d6d3d1" font-weight="600">RabbitMQ  (MassTransit)</text>

    <!-- Events label -->
    <text x="200" y="468" text-anchor="middle" font-size="11" fill="#78716c">UserRegistered · PolicyActivated</text>
    <text x="800" y="468" text-anchor="middle" font-size="11" fill="#78716c">ClaimSubmitted · ClaimStatusChanged</text>

    <!-- ── DATA LAYER ── -->
    <rect x="20" y="512" width="1020" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="532" text-anchor="middle" font-size="11" fill="#475569" font-weight="600" letter-spacing="1">DATA LAYER</text>

    <!-- Identity DB -->
    <rect x="40" y="542" width="190" height="36" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
    <text x="135" y="565" text-anchor="middle" font-size="12" fill="#86efac">Identity DB  (MSSQL)</text>

    <!-- Policy DB -->
    <rect x="268" y="542" width="190" height="36" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
    <text x="363" y="565" text-anchor="middle" font-size="12" fill="#93c5fd">Policy DB  (MSSQL)</text>

    <!-- Claims DB -->
    <rect x="496" y="542" width="190" height="36" rx="8" fill="#431407" stroke="#c2410c" stroke-width="1"/>
    <text x="591" y="565" text-anchor="middle" font-size="12" fill="#fdba74">Claims DB  (MSSQL)</text>

    <!-- Admin DB -->
    <rect x="724" y="542" width="180" height="36" rx="8" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
    <text x="814" y="565" text-anchor="middle" font-size="12" fill="#c4b5fd">Admin DB  (MSSQL)</text>

    <!-- S3 / Cloud -->
    <rect x="932" y="542" width="100" height="36" rx="8" fill="#1c1917" stroke="#92400e" stroke-width="1"/>
    <text x="982" y="560" text-anchor="middle" font-size="12" fill="#fbbf24">AWS S3</text>
    <text x="982" y="573" text-anchor="middle" font-size="11" fill="#d97706">Documents</text>

    <!-- ── EXTERNAL LAYER ── -->
    <rect x="20" y="612" width="1020" height="56" rx="12" fill="#0c0a09" stroke="#292524" stroke-width="1"/>
    <text x="530" y="630" text-anchor="middle" font-size="11" fill="#44403c" font-weight="600" letter-spacing="1">EXTERNAL SERVICES</text>

    <rect x="60" y="638" width="130" height="24" rx="6" fill="#1c1917" stroke="#ca8a04" stroke-width="1"/>
    <text x="125" y="654" text-anchor="middle" font-size="12" fill="#fde68a">Razorpay</text>

    <rect x="220" y="638" width="130" height="24" rx="6" fill="#1c1917" stroke="#0284c7" stroke-width="1"/>
    <text x="285" y="654" text-anchor="middle" font-size="12" fill="#7dd3fc">Google OAuth</text>

    <rect x="380" y="638" width="130" height="24" rx="6" fill="#1c1917" stroke="#16a34a" stroke-width="1"/>
    <text x="445" y="654" text-anchor="middle" font-size="12" fill="#86efac">SMTP Email</text>

    <rect x="540" y="638" width="130" height="24" rx="6" fill="#1c1917" stroke="#7c3aed" stroke-width="1"/>
    <text x="605" y="654" text-anchor="middle" font-size="12" fill="#c4b5fd">Serilog / Logging</text>

    <rect x="700" y="638" width="160" height="24" rx="6" fill="#1c1917" stroke="#b45309" stroke-width="1"/>
    <text x="780" y="654" text-anchor="middle" font-size="12" fill="#fcd34d">Correlation ID MW</text>

    <!-- ── ARROWS ── -->
    <!-- Client → Gateway -->
    <line x1="420" y1="84" x2="490" y2="148" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <line x1="640" y1="84" x2="520" y2="148" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Gateway → Services -->
    <line x1="400" y1="188" x2="215" y2="254" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="460" y1="188" x2="400" y2="254" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="530" y1="188" x2="600" y2="254" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="580" y1="188" x2="870" y2="254" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Services → Message Bus -->
    <line x1="150" y1="384" x2="430" y2="452" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
    <line x1="400" y1="384" x2="480" y2="452" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
    <line x1="650" y1="384" x2="560" y2="452" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
    <line x1="905" y1="384" x2="650" y2="452" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

    <!-- Services → DBs -->
    <line x1="150" y1="384" x2="135" y2="542" stroke="#4ade80" stroke-width="1" marker-end="url(#arr-green)"/>
    <line x1="400" y1="384" x2="363" y2="542" stroke="#4ade80" stroke-width="1" marker-end="url(#arr-green)"/>
    <line x1="650" y1="384" x2="591" y2="542" stroke="#4ade80" stroke-width="1" marker-end="url(#arr-green)"/>
    <line x1="905" y1="384" x2="814" y2="542" stroke="#4ade80" stroke-width="1" marker-end="url(#arr-green)"/>

    <!-- Claims → S3 -->
    <line x1="760" y1="340" x2="932" y2="560" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-orange)"/>
  </svg>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Angular → Gateway</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>Gateway routing</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fb923c; border: 1px dashed #fb923c"></div>Async events (RabbitMQ)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Database access</div>
  </div>
</div>
</body>
</html>
